# Publishes the modpack to CurseForge when a GitHub Release with tag "vX.Y.Z" is published.
#   Regular release -> "release" on CurseForge
#   Pre-release     -> "alpha" on CurseForge
# The release description is used as the CurseForge changelog.
#
# Setup (GitHub -> Settings -> Secrets and variables -> Actions):
#   Secret    CF_API_TOKEN   token from https://authors.curseforge.com/account/api-tokens
#   Variable  CF_PROJECT_ID  numeric CurseForge project ID
#
# Usage:  gh release create v1.0.1 [--prerelease] --notes "..."

name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        type: choice
        options: [release, beta, alpha]
        default: release

env:
  MC_VERSION: "1.21.1"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Take version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pack.toml

      - name: Export for CurseForge
        id: export
        run: |
          packwiz refresh
          NAME=$(sed -n 's/^name = "\(.*\)"/\1/p' pack.toml)
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pack.toml)
          FILE="$NAME-$VERSION.zip"
          packwiz -y curseforge export -o "$FILE"
          # CurseForge rejects jars of CurseForge-hosted mods bundled in overrides/
          if unzip -l "$FILE" | grep -q '\.jar$'; then
            echo "::error::The zip contains bundled .jar files (mods not sourced from CurseForge):"
            unzip -l "$FILE" | grep '\.jar$'
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "display=$NAME $VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          RELEASE_TYPE: ${{ inputs.release_type || (github.event.release.prerelease && 'alpha') || 'release' }}
          CHANGELOG: ${{ github.event.release.body }}
          FILE: ${{ steps.export.outputs.file }}
          DISPLAY: ${{ steps.export.outputs.display }}
        run: |
          set -euo pipefail
          : "${CF_API_TOKEN:?Missing secret CF_API_TOKEN}"
          : "${CF_PROJECT_ID:?Missing variable CF_PROJECT_ID}"
          API=https://minecraft.curseforge.com/api
          AUTH="X-Api-Token: $CF_API_TOKEN"

          # "1.21.1" -> version type "minecraft-1-21" -> numeric version ID
          SLUG="minecraft-$(echo "$MC_VERSION" | cut -d. -f1,2 | tr . -)"
          TYPE_ID=$(curl -sf -H "$AUTH" "$API/game/version-types" \
            | jq --arg s "$SLUG" '.[] | select(.slug == $s) | .id')
          GV_ID=$(curl -sf -H "$AUTH" "$API/game/versions" \
            | jq --arg v "$MC_VERSION" --argjson t "$TYPE_ID" \
                 '[.[] | select(.name == $v and .gameVersionTypeID == $t) | .id][0]')
          [ "$GV_ID" != "null" ] || { echo "Minecraft version $MC_VERSION not found"; exit 1; }

          [ -n "${CHANGELOG:-}" ] || CHANGELOG="$DISPLAY"
          META=$(jq -n --arg n "$DISPLAY" --arg r "$RELEASE_TYPE" --argjson gv "$GV_ID" \
            --arg c "$CHANGELOG" \
            '{displayName: $n, releaseType: $r, gameVersions: [$gv],
              changelog: $c, changelogType: "markdown"}')

          curl --fail-with-body -H "$AUTH" \
            -F "metadata=$META" -F "file=@$FILE" \
            "$API/projects/$CF_PROJECT_ID/upload-file"

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.export.outputs.file }}
